<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>by Potet</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap');
        :root { --bg: #0b0e14; --card: #151921; --accent: #5865f2; --border: #2d333b; --text-main: #adbac7; --m1: #34d399; --m2: #fbbf24; --m3: #a78bfa; --m4: #f472b6; --glow: #fbbf24; }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(255, 255, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 380px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px; box-shadow: 10px 0 30px rgba(0,0,0,0.3); z-index: 10; overflow-y: auto; }
        
        .btn-run { background: linear-gradient(135deg, #fff 0%, #e2e8f0 100%); color: #000; border: none; padding: 20px; border-radius: 16px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 15px; margin-bottom: 30px; letter-spacing: 1px; flex-shrink: 0; animation: pulse 2s infinite; }
        
        /* Modernized Toggle Button */
        .btn-tool { background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 10px; font-size: 11px; cursor: pointer; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; backdrop-filter: blur(5px); margin-bottom: 10px; }
        .btn-tool:hover { background: rgba(255,255,255,0.08); border-color: var(--text-main); }

        details { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; height: 45px; }
        details[open] { height: auto; background: rgba(255,255,255,0.04); }
        summary { padding: 14px; cursor: pointer; list-style: none; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: space-between; text-transform: uppercase; outline: none; }
        
        .content { padding: 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; background: rgba(0,0,0,0.2); animation: fadeIn 0.4s ease-out; }
        .origin-tag { font-size: 9px; color: #5865f2; background: rgba(88, 101, 242, 0.1); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono'; margin-left: 8px; }
        
        .trivia-box { margin-top: auto; padding: 18px; border: 1px solid var(--border); border-radius: 12px; background: linear-gradient(to bottom right, rgba(255,255,255,0.02), rgba(0,0,0,0.4)); min-height: 110px; flex-shrink: 0; }
        .trivia-text { font-size: 11px; color: #adbac7; line-height: 1.6; font-style: italic; }
        
        .glyph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; max-height: 120px; overflow-y: auto; padding: 8px; background: #000; border-radius: 8px; }
        .glyph-item { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #1c2128; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; cursor: pointer; }
        .glyph-item.active { border-color: var(--m1); color: #fff; background: rgba(52, 211, 153, 0.1); box-shadow: 0 0 10px rgba(52, 211, 153, 0.2); }
        
        .row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; margin: 4px 0; }
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
        
        input[type="range"] { -webkit-appearance: none; height: 6px; background: #2d333b; border-radius: 5px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: var(--m2); border-radius: 50%; cursor: pointer; box-shadow: 0 0 12px var(--m2); border: 2px solid #fff; }

        .main-content { flex: 1; padding: 40px; background: #0d1117; display: flex; flex-direction: column; }
        #editor { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 40px; font-family: 'JetBrains Mono', monospace; font-size: 28px; outline: none; white-space: pre-wrap; overflow-y: auto; color: #fff; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        #editor:empty:before { content: "Type your message..."; color: #444c56; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <button class="btn-run" id="statusBtn" onclick="gay3()">ACTIVATE</button>
        
        <details>
            <summary style="color: var(--m1);">Character Swap</summary>
            <div class="content">
                <label class="row"><span>Enable System</span><input type="checkbox" id="m1"></label>
                <button class="btn-tool" onclick="gay1()">Sync All Glyphs</button>
                <div class="glyph-grid" id="glyphGrid"></div>
            </div>
        </details>

        <details open>
            <summary style="color: var(--m2);">Invisible Signs</summary>
            <div class="content">
                <label class="row"><span>Enable System</span><input type="checkbox" id="m2"></label>
                <div class="row"><span>Power</span><input type="range" id="intensity" min="1" max="15" value="6"></div>
                <label class="row"><span>Z-Width Space <span class="origin-tag">U+200B</span></span><input type="checkbox" class="ghost" value="200B"></label>
                <label class="row"><span>Z-Width Joiner <span class="origin-tag">U+200D</span></span><input type="checkbox" class="ghost" value="200D"></label>
                <label class="row"><span>Word Joiner <span class="origin-tag">U+2060</span></span><input type="checkbox" class="ghost" value="2060"></label>
            </div>
        </details>

        <details>
            <summary style="color: var(--m3);">Arab Method</summary>
            <div class="content">
                <label class="row"><span>Enable System <span class="origin-tag">RLO</span></span><input type="checkbox" id="m3"></label>
            </div>
        </details>

        <details>
            <summary style="color: var(--m4);">Rainbow Text</summary>
            <div class="content">
                <label class="row"><span>Enable ANSI Glow <span class="origin-tag">SGR</span></span><input type="checkbox" id="m4"></label>
            </div>
        </details>

        <div class="trivia-box" onclick="newFact()" style="cursor:pointer">
            <div class="trivia-title" style="color: var(--m2);">SPEECH INTEL</div>
            <div id="triviaText" class="trivia-text">Click for knowledge...</div>
        </div>
    </aside>

    <main class="main-content">
        <div id="editor" contenteditable="true" spellcheck="false" onfocus="gay2(this)">Type your message...</div>
    </main>

<script>
    const glyphs = {'a':'ᗅ','b':'₿','c':'ᑡ','d':'ↇ','e':'𐌄','f':'ϝ','g':'ᏽ','h':'ⴼ','i':'ı','j':'ᒚ','k':'ᛕ','l':'ᢺ','m':'ᱬ','n':'ห','o':'𐍉','p':'Ϸ','r':'ᖇ','s':'ᔜ','t':'丁','u':'Ǚ','v':'ⴸ','w':'Ш','x':'𐌗','y':'ሄ','z':'Ⴭ'};
    const facts = [
        "Ancient Athens had 'Parrhesia'—the duty to speak the absolute truth regardless of the risk.",
        "The first government book burning was likely in China, 213 BC, to erase history.",
        "Encryption is legally recognized as a form of protected speech in the U.S.",
        "Cyber-speech was officially ruled as protected by the Supreme Court in 1997.",
        "Anonymity has been vital to free speech since 'The Federalist Papers' were signed 'Publius'.",
        "The 'Streisand Effect' proves that trying to ban speech usually makes it go viral.",
        "Language naturally evolves to bypass filters; slang is humanity's oldest anti-censorship tool.",
        "Samizdat (Soviet underground publishing) used hand-copying to keep banned ideas alive.",
        "The 1689 Bill of Rights was one of the first laws to protect parliamentary free speech.",
        "Socrates chose execution over silencing his own speech in 399 BC."
    ];

    function newFact() {
        const text = document.getElementById('triviaText');
        text.style.opacity = '0';
        setTimeout(() => {
            let r;
            do { r = facts[Math.floor(Math.random() * facts.length)]; } while (r === text.innerText);
            text.innerText = r;
            text.style.opacity = '1';
        }, 200);
    }
    
    newFact();

    const colors = ['31', '33', '32', '34', '35', '36'];
    let activeGlyphs = {};
    const grid = document.getElementById('glyphGrid');

    Object.keys(glyphs).forEach(key => {
        const item = document.createElement('div');
        item.className = 'glyph-item';
        item.innerText = glyphs[key];
        item.dataset.key = key;
        item.onclick = (e) => {
            e.stopPropagation();
            item.classList.toggle('active');
            if(item.classList.contains('active')) activeGlyphs[key] = glyphs[key];
            else delete activeGlyphs[key];
        };
        grid.appendChild(item);
    });

    function gay1() {
        const anyActive = document.querySelector('.glyph-item.active');
        document.querySelectorAll('.glyph-item').forEach(item => {
            if (!anyActive) { item.classList.add('active'); activeGlyphs[item.dataset.key] = item.innerText; }
            else { item.classList.remove('active'); delete activeGlyphs[item.dataset.key]; }
        });
    }

    function gay2(el) { if(el.innerText === "Type your message...") el.innerHTML = ""; }

    function gay3() {
        const editor = document.getElementById('editor');
        if (editor.innerText === "" || editor.innerText === "Type your message...") return;
        gay4();
        setTimeout(gay5, 50);
        newFact();
    }

    function gay4() {
        const editor = document.getElementById('editor');
        let rawText = editor.innerText.replace(/[\u200B-\u200F\u202C-\u202E\uFEFF\u2060\u00AD\u2063\u061C\u3164]/g, '');
        const m1 = document.getElementById('m1').checked;
        const m2 = document.getElementById('m2').checked;
        const m3 = document.getElementById('m3').checked;
        const m4 = document.getElementById('m4').checked;
        const power = parseInt(document.getElementById('intensity').value);
        const selectedGhosts = Array.from(document.querySelectorAll('.ghost:checked')).map(cb => String.fromCodePoint(parseInt(cb.value, 16)));
        
        if (m3) rawText = rawText.split('\n').map(line => line.split('').reverse().join('')).join('\n');
        
        let html = m3 ? "\u202E" : "";
        for (let i = 0; i < rawText.length; i++) {
            let char = rawText[i];
            if (m1 && activeGlyphs[char.toLowerCase()]) char = activeGlyphs[char.toLowerCase()];
            let batch = "";
            if (m2 && !"\n ".includes(char) && char !== "\u202E" && selectedGhosts.length > 0) {
                for(let j=0; j<power; j++) batch += selectedGhosts[Math.floor(Math.random()*selectedGhosts.length)];
            }
            if (m4 && !"\n ".includes(char) && char !== "\u202E") {
                html += `<span class="c${colors[i % colors.length]}">${char}${batch}</span>`;
            } else {
                html += char + batch;
            }
        }
        if (m3) html += "\u202C";
        editor.innerHTML = html;
    }

    function gay5() {
        const editor = document.getElementById('editor');
        const isRainbow = document.getElementById('m4').checked;
        let output = isRainbow ? "```ansi\n" : "";
        const walk = (nodes) => {
            let s = "";
            for (let n of nodes) {
                if (n.nodeType === 3) s += n.textContent;
                else if (n.nodeName === "SPAN") s += isRainbow ? `\x1b[${n.className.replace('c','')}m${n.textContent}\x1b[0m` : n.textContent;
                else if (n.nodeName === "BR") s += "\n";
                else if (n.nodeName === "DIV") s += "\n" + walk(n.childNodes);
                else if (n.childNodes) s += walk(n.childNodes);
            }
            return s;
        };
        output += walk(editor.childNodes);
        if (isRainbow) output += "\n```";
        navigator.clipboard.writeText(output).then(() => {
            const btn = document.getElementById('statusBtn');
            btn.innerText = "COPIED!";
            btn.style.background = "#34d399";
            setTimeout(() => { btn.innerText = "ACTIVATE"; btn.style.background = "linear-gradient(135deg, #fff 0%, #e2e8f0 100%)"; }, 1000);
        });
    }
</script>
</body>
</html>
