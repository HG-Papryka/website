<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>by Potet</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap');
        :root { --bg: #0b0e14; --card: #151921; --accent: #5865f2; --border: #2d333b; --text-main: #adbac7; --m1: #34d399; --m2: #fbbf24; --m3: #a78bfa; --m4: #f472b6; --m5: #00d4ff; }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(255, 255, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        * { box-sizing: border-box; transition: all 0.2s ease; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 380px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px; z-index: 10; overflow-y: auto; }
        .btn-run { background: #fff; color: #000; border: none; padding: 20px; border-radius: 16px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 15px; margin-bottom: 20px; animation: pulse 2s infinite; }
        
        details { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; }
        summary { padding: 14px; cursor: pointer; list-style: none; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: space-between; text-transform: uppercase; }
        
        .content { padding: 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; background: rgba(0,0,0,0.2); animation: fadeIn 0.3s ease; }
        .origin-tag { font-size: 9px; color: #5865f2; background: rgba(88, 101, 242, 0.1); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono'; }
        
        .glyph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; max-height: 120px; overflow-y: auto; padding: 8px; background: #000; border-radius: 8px; }
        .glyph-item { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #1c2128; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; cursor: pointer; }
        .glyph-item.active { border-color: var(--m1); color: #fff; background: rgba(52, 211, 153, 0.1); }
        
        .row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
        input[type="range"] { width: 100px; accent-color: var(--m2); }

        .main-content { flex: 1; padding: 40px; background: #0d1117; display: flex; flex-direction: column; }
        #editor { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 40px; font-family: 'JetBrains Mono'; font-size: 24px; outline: none; white-space: pre-wrap; overflow-y: auto; color: #fff; }
        #editor:empty:before { content: "Type your message..."; color: #444c56; }

        @media (max-width: 850px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 50%; order: 2; border-right: none; border-top: 1px solid var(--border); }
            .main-content { height: 50%; padding: 15px; }
            #editor { font-size: 18px; padding: 20px; }
        }
    </style>
</head>
<body>
    <main class="main-content">
        <div id="editor" contenteditable="true" spellcheck="false" onfocus="if(this.innerText==='Type your message...')this.innerHTML=''">Type your message...</div>
    </main>
    <aside class="sidebar">
        <button class="btn-run" id="statusBtn" onclick="run()">ACTIVATE</button>
        <details>
            <summary style="color: var(--m1);">Glyph Swap</summary>
            <div class="content">
                <label class="row"><span>Active</span><input type="checkbox" id="m1"></label>
                <div class="glyph-grid" id="grid"></div>
            </div>
        </details>
        <details>
            <summary style="color: var(--m2);">Invisibles</summary>
            <div class="content">
                <label class="row"><span>Active</span><input type="checkbox" id="m2"></label>
                <div class="row"><span>Power</span><input type="range" id="power" min="1" max="15" value="6"></div>
                <label class="row"><span>U+200B</span><input type="checkbox" class="ghost" value="200B" checked></label>
            </div>
        </details>
        <details open>
            <summary style="color: var(--m4);">Discord Methods</summary>
            <div class="content">
                <label class="row"><span>Link Mask [N](...)</span><input type="checkbox" id="m5" checked></label>
                <label class="row"><span>Rainbow ANSI</span><input type="checkbox" id="m4"></label>
                <label class="row"><span>Arab Reverse</span><input type="checkbox" id="m3"></label>
            </div>
        </details>
    </aside>
<script>
    const glyphs = {'a':'ᗅ','b':'₿','c':'ᑡ','d':'ↇ','e':'𐌄','f':'ϝ','g':'ᏽ','h':'ⴼ','i':'ı','j':'ᒚ','k':'ᛕ','l':'ᢺ','m':'ᱬ','n':'ห','o':'𐍉','p':'Ϸ','r':'ᖇ','s':'ᔜ','t':'丁','u':'Ǚ','v':'ⴸ','w':'Ш','x':'𐌗','y':'ሄ','z':'Ⴭ'};
    let active = {};
    Object.keys(glyphs).forEach(k => {
        let d = document.createElement('div'); d.className = 'glyph-item'; d.innerText = glyphs[k];
        d.onclick = () => { d.classList.toggle('active'); if(d.classList.contains('active')) active[k]=glyphs[k]; else delete active[k]; };
        document.getElementById('grid').appendChild(d);
    });
    function run() {
        let ed = document.getElementById('editor');
        let txt = ed.innerText.replace(/[\u200B-\u200F\u202C-\u202E\uFEFF\u2060]/g, '').replace(/\[(.)\]\(https:\/\/\.\/\)/g, '$1');
        let m1 = document.getElementById('m1').checked, m2 = document.getElementById('m2').checked, m3 = document.getElementById('m3').checked, m4 = document.getElementById('m4').checked, m5 = document.getElementById('m5').checked;
        if(m3) txt = txt.split('\n').map(l => l.split('').reverse().join('')).join('\n');
        let res = m3 ? "\u202E" : "";
        for(let i=0; i<txt.length; i++) {
            let c = txt[i];
            if(m1 && active[c.toLowerCase()]) c = active[c.toLowerCase()];
            if(m5 && !"\n ".includes(c) && c !== "\u202E") c = `[${c}](https://./)`;
            let b = "";
            if(m2 && !"\n ".includes(txt[i]) && c !== "\u202E") {
                for(let j=0; j<document.getElementById('power').value; j++) b += "\u200B";
            }
            if(m4 && !"\n ".includes(txt[i])) res += `<span style="color:var(--m4)">${c}${b}</span>`;
            else res += c + b;
        }
        ed.innerHTML = res + (m3 ? "\u202C" : "");
        let out = m4 ? "```ansi\n" : "";
        let walk = (n) => {
            let s = "";
            for(let x of n) {
                if(x.nodeType === 3) s += x.textContent;
                else if(x.nodeName === "SPAN") s += (m4 ? "\x1b[35m"+x.textContent+"\x1b[0m" : x.textContent);
                else if(x.nodeName === "BR") s += "\n";
                else if(x.childNodes) s += walk(x.childNodes);
            }
            return s;
        };
        out += walk(ed.childNodes) + (m4 ? "\n```" : "");
        navigator.clipboard.writeText(out);
        document.getElementById('statusBtn').innerText = "COPIED!";
        setTimeout(() => document.getElementById('statusBtn').innerText = "ACTIVATE", 1000);
    }
</script>
</body>
</html>
